<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faculty Directory - Campus Navigator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- 🌟 Hero Banner -->
  <section class="hero-banner">
    <h1>Campus Navigator</h1>
    <p>Find Faculty Cabins & Offices with Ease</p>
  </section>

  <!-- 🔍 Search Section -->
  <section class="search-section">
    <input type="text" id="searchBar" placeholder="Search faculty by name, school, or specialization...">
  </section>

  <!-- 👨‍🏫 Faculty Cards -->
  <section class="faculty-container" id="facultyContainer">
    <!-- Faculty cards will be inserted dynamically -->
  </section>

  <!-- 🔗 Footer -->
  <footer class="nav-footer">
    <a href="index.html">Home</a>
    <a href="faculty.html">Faculty</a>
    <a href="hostel.html">Hostel Reviews</a>
    <a href="food.html">Food Street</a>
  </footer>

  <!-- 📜 JavaScript to Fetch Data -->
  <script>
    async function loadFaculty() {
      try {
        const response = await fetch("faculty.json"); // load JSON file
        const data = await response.json();

        const container = document.getElementById("facultyContainer");
        const searchBar = document.getElementById("searchBar");

        // Function to display faculty
        function displayFaculty(faculties) {
          container.innerHTML = "";
          faculties.forEach(faculty => {
            const card = document.createElement("div");
            card.className = "faculty-card";

            card.innerHTML = `
              <img src="${faculty.photoUrl}" alt="${faculty.name}">
              <h3>${faculty.name}</h3>
              <p><strong>Designation:</strong> ${faculty.designation}</p>
              <p><strong>School:</strong> ${faculty.school}</p>
              <p><strong>Specialisation:</strong> ${faculty.specialisation}</p>
              <p><strong>Email:</strong> <a href="mailto:${faculty.email}">${faculty.email}</a></p>
              <p><strong>Cabin:</strong> ${faculty.cabin}</p>
            `;

            container.appendChild(card);
          });
        }

        // Initial display
        displayFaculty(data);

        // Search filter
        searchBar.addEventListener("input", (e) => {
          const value = e.target.value.toLowerCase();
          const filtered = data.filter(f =>
            f.name.toLowerCase().includes(value) ||
            f.school.toLowerCase().includes(value) ||
            f.specialisation.toLowerCase().includes(value)
          );
          displayFaculty(filtered);
        });

      } catch (error) {
        console.error("Error loading faculty data:", error);
      }
    }

    loadFaculty();
  </script>

</body>
</html>
