<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yellow Tag Faculty (SCOPE)</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Particle Background -->
  <canvas id="particles"></canvas>

  <!-- 🔷 Hero Banner -->
  <header class="hero-banner">
    <h1 class="animated-text">Yellow Tag Faculty (SCOPE)</h1>
    <p>Find Faculty Cabins & Office Locations Easily</p>
  </header>

  <!-- 🔗 Sub Navigation (below hero banner) -->
  <nav class="sub-nav">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="offices.html">Offices</a>
    <a href="faculty.html">Faculty Cabins</a>
  </nav>

  <!-- 🔍 Search Input -->
  <input
    type="text"
    id="yellow-faculty-search"
    placeholder="Search faculty by name..."
  />

  <!-- 📌 Faculty Cards Section -->
  <main>
    <section id="yellow-faculty-container" class="yellow-faculty-container">
      <!-- Cards injected by JS -->
    </section>
  </main>

  <!-- ---------------- Footer ---------------- -->
  <footer class="nav-footer">
    <!-- Sub-navigation in footer -->
    <nav class="sub-nav">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="offices.html">Offices</a>
      <a href="faculty.html">Faculty Cabins</a>
    </nav>

    <!-- Developed by text -->
    <p>Developed by Diwakar</p>

    <!-- Contact Icons -->
    <div class="footer-contact">
      <a href="#" target="_blank" title="Instagram">
        <img src="assets/instagram.png" alt="Instagram">
      </a>
      <a href="#" target="_blank" title="LinkedIn">
        <img src="assets/linkedin.png" alt="LinkedIn">
      </a>
      <a href="mailto:example@gmail.com" target="_blank" title="Gmail">
        <img src="assets/gmail.png" alt="Gmail">
      </a>
    </div>
  </footer>

  <!-- Particles.js library -->
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  <script src="js/yellow_faculty.js"></script>
</body>
</html>
