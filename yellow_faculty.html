<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Research Scholar Faculty (SCOPE)</title>
  <!-- Font Awesome for social icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0f0f1a;
      color: #f5f5f5;
      overflow-x: hidden;
    }

    /* Particle Background */
    canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: -1;
    }

    /* Hero Banner */
    .hero-banner {
      position: relative;
      background: url('images/VIT-AP.jpg') no-repeat center center;
      background-size: cover;
      padding: 2rem;
      text-align: center;
      color: #f5f5f5;
    }
    .hero-banner::after {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      z-index: 0;
    }
    .hero-banner h1,
    .hero-banner p {
      position: relative;
      z-index: 1;
    }
    .hero-banner h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      text-shadow: 0 0 20px rgba(0, 255, 255, 0.7);
    }
    .hero-banner p {
      font-size: 1.2rem;
      color: #bbb;
    }

    /* Navigation */
    nav.sub-nav {
      display: flex;
      justify-content: center;
      gap: 20px;
      background: rgba(255, 255, 255, 0.05);
      padding: 1rem;
      backdrop-filter: blur(5px);
    }
    nav.sub-nav a {
      color: cyan;
      text-decoration: none;
      font-weight: bold;
      transition: color 0.3s;
    }
    nav.sub-nav a:hover {
      color: white;
    }

    /* Search bar */
    #yellow-faculty-search {
      display: block;
      margin: 20px auto;
      padding: 10px 15px;
      width: 320px;
      max-width: 90%;
      border-radius: 20px;
      border: none;
      outline: none;
      font-size: 1rem;
    }

    /* Faculty container */
    .yellow-faculty-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    /* Faculty card */
    .faculty-card {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      transition: transform 0.3s, box-shadow 0.3s;
      height: 220px; /* fixed equal size */
      display: flex;
      flex-direction: column;
      justify-content: center;
      opacity: 0;
      animation: fadeInUp 0.6s forwards;
    }
    .faculty-card:hover {
      transform: translateY(-10px) scale(1.05);
      box-shadow: 0 8px 30px rgba(0, 255, 255, 0.6);
    }
    .faculty-card h3 {
      margin: 0 0 10px;
      color: cyan;
    }
    .faculty-card p {
      margin: 5px 0;
    }

    /* Highlighted search text */
    .highlight {
      background-color: cyan;
      color: #000;
      padding: 2px 4px;
      border-radius: 4px;
    }

    /* Fade-in animation */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Footer */
    footer.nav-footer {
      background: #111;
      text-align: center;
      padding: 25px;
      margin-top: 40px;
    }
    footer p {
      margin: 10px 0;
    }
    .footer-contact a {
      color: #f5f5f5;
      margin: 0 10px;
      font-size: 1.3rem;
      transition: color 0.3s, transform 0.3s;
    }
    .footer-contact a:hover {
      color: #00e0ff;
      transform: scale(1.2);
    }
  </style>
</head>
<body>

  <!-- Particle Background -->
  <canvas id="particles"></canvas>

  <!-- Hero Banner -->
  <header class="hero-banner">
    <h1 class="animated-text">Yellow Tag Faculty (SCOPE)</h1>
    <p>Find Faculty Cabins & Office Locations Easily</p>
  </header>

  <!-- Navigation below hero -->
  <nav class="sub-nav">
    <a href="index.html">Home</a>
    <a href="offices.html">Offices</a>
    <a href="faculty.html">Faculty Cabins</a>
  </nav>

  <!-- Search -->
  <input type="text" id="yellow-faculty-search" placeholder="Search faculty by name..."/>

  <!-- Faculty Cards Section -->
  <main>
    <section id="yellow-faculty-container" class="yellow-faculty-container">
      <!-- Cards injected by JS -->
    </section>
  </main>

  <!-- Footer -->
  <footer class="nav-footer">
    <nav class="sub-nav">
      <a href="index.html">Home</a>
      <a href="offices.html">Offices</a>
      <a href="faculty.html">Faculty Cabins</a>
    </nav>

    <p>Developed by Diwakar</p>

    <div class="footer-contact">
      <a href="https://instagram.com" target="_blank" title="Instagram"><i class="fab fa-instagram"></i></a>
      <a href="https://linkedin.com" target="_blank" title="LinkedIn"><i class="fab fa-linkedin"></i></a>
      <a href="mailto:example@gmail.com" target="_blank" title="Gmail"><i class="fas fa-envelope"></i></a>
    </div>
  </footer>

  <!-- Particles.js library -->
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>

  <!-- JS for Faculty Cards and Search -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      let facultyData = [];
      const container = document.getElementById("yellow-faculty-container");
      const searchInput = document.getElementById("yellow-faculty-search");

      function highlightText(text, searchTerm) {
        if (!searchTerm) return text;
        const regex = new RegExp(`(${searchTerm})`, "gi");
        return text.replace(regex, `<span class="highlight">$1</span>`);
      }

      function renderCards(data, searchTerm = "") {
        container.innerHTML = "";
        data.forEach((faculty, index) => {
          const card = document.createElement("div");
          card.classList.add("faculty-card");
          card.style.animationDelay = `${index * 0.2}s`;

          card.innerHTML = `
            <h3>${highlightText(faculty.name, searchTerm)}</h3>
            <p><strong>Roll:</strong> ${faculty.roll}</p>
            <p><strong>Employee ID:</strong> ${faculty.id}</p>
            <p><strong>Cabin:</strong> ${faculty.cabin}</p>
          `;
          container.appendChild(card);
        });
      }

      // Initialize particle background
      if (window.particlesJS) {
        particlesJS("particles", {
          particles: {
            number: { value: 80, density: { enable: true, value_area: 800 } },
            color: { value: "#00c6ff" },
            shape: { type: "circle" },
            opacity: { value: 0.5, anim: { enable: true, speed: 1, opacity_min: 0.1 } },
            size: { value: 3, random: true },
            line_linked: { enable: true, distance: 150, color: "#00c6ff", opacity: 0.4, width: 1 },
            move: { enable: true, speed: 2, direction: "none", random: false, straight: false, out_mode: "out", bounce: false }
          },
          interactivity: {
            detect_on: "canvas",
            events: {
              onhover: { enable: true, mode: "grab" },
              onclick: { enable: true, mode: "push" },
              resize: true
            },
            modes: {
              grab: { distance: 140, line_linked: { opacity: 0.7 } },
              push: { particles_nb: 4 }
            }
          },
          retina_detect: true
        });
      }

      // Fetch faculty data
      fetch("data/faculty_yellow_tag.json")
        .then(response => response.json())
        .then(data => {
          facultyData = data;
          renderCards(facultyData);
        })
        .catch(error => console.error("Error loading JSON:", error));

      // Search functionality
      searchInput.addEventListener("input", () => {
        const searchTerm = searchInput.value.toLowerCase();
        const filtered = facultyData.filter(f => f.name.toLowerCase().includes(searchTerm));
        renderCards(filtered, searchTerm);
      });
    });
  </script>
</body>
</html>
